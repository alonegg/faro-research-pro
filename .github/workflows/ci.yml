name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps for xhtml2pdf → pycairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev

      - name: Install package (server + dev extras)
        run: |
          python -m pip install --upgrade pip
          # OSS faro-research isn't on PyPI yet; install from GitHub then Pro
          # with --no-deps so pip doesn't try to re-resolve it.
          pip install "faro-research[server,export] @ git+https://github.com/alonegg/faro-research.git@main"
          pip install --no-deps -e ".[server,dev]"
          pip install xhtml2pdf httpx ruff pytest

      - name: Ruff lint
        run: ruff check faro_research_pro

      - name: Smoke (no LLM, no network)
        env:
          FARO_OPENAI_API_KEY: ci-stub
          FARO_PROVIDER: openai_compat
          TUSHARE_TOKEN: ci-stub
          FARO_DB_PATH: /tmp/pro-ci.db
        run: |
          python - <<'PY'
          # 1) Branded export pipeline (no LLM)
          from faro_research_pro import BrandConfig, branded_markdown_to_pdf, branded_markdown
          md = """# Test report\n\nA short body.\n\n| a | b |\n|---|---|\n| 1 | 2 |"""
          pdf = branded_markdown_to_pdf(md, brand=BrandConfig(author="ci"))
          assert pdf[:5] == b"%PDF-", pdf[:20]
          assert len(pdf) > 2000, f"too small: {len(pdf)}"
          assert "Test report" in branded_markdown(md, brand=BrandConfig())

          # 2) Reviewer JSON parser (no LLM)
          from faro_research_pro.agents.reviewer import _parse_review
          r = _parse_review('{"verdict":"approve","score":9,"summary":"good","issues":[],"must_fix":[]}')
          assert r.is_approved and r.score == 9

          # 3) Server module imports cleanly
          from faro_research_pro.server import app
          assert app is not None

          print("pro smoke ok")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Write CI .env (no real secrets)
        run: |
          cat > .env <<'EOF'
          FARO_PROVIDER=openai_compat
          FARO_OPENAI_BASE_URL=https://api.deepseek.com
          FARO_OPENAI_API_KEY=ci-stub
          FARO_OPENAI_MODEL=deepseek-chat
          TUSHARE_TOKEN=ci-stub
          FARO_DB_PATH=/app/data/faro.db
          FARO_CORS_ORIGINS=http://localhost:5174
          EOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T backend python -c "import httpx; r = httpx.get('http://localhost:8000/api/health'); r.raise_for_status(); print(r.json())" 2>/dev/null; then
              echo "backend healthy"; exit 0
            fi
            echo "waiting... ($i)"; sleep 2
          done
          docker compose logs backend; exit 1

      - name: Verify Pro health endpoint
        run: |
          docker compose exec -T backend python - <<'PY'
          import httpx
          h = httpx.get("http://localhost:8000/api/pro/health").json()
          assert "pro_version" in h, h
          assert "oss_version" in h, h
          print("pro/health ok:", h)
          PY

      - name: Verify web container serves UI shell
        run: curl -fsS http://localhost:5174/ | grep -q "Faro Research" && echo "ui ok"

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
